name: etkan-proxy

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: etkan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Host resolv.conf is 127.0.0.53 (systemd-resolved); that address is dead inside the container.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
