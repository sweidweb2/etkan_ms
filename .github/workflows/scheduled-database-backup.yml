name: Weekly database SQL backup

# Uploads public-tables + auth SQL to Supabase Storage bucket `database-backups`.
# No media. Hits the deployed app cron route with CRON_SECRET.
on:
  schedule:
    # Sundays 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: scheduled-database-backup
  cancel-in-progress: false

jobs:
  backup-production:
    name: Backup production database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Trigger production backup
        env:
          CRON_URL: ${{ secrets.PROD_DATABASE_BACKUP_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set PROD_DATABASE_BACKUP_CRON_URL (e.g. https://etkan.org/api/cron/database-backup) and CRON_SECRET."
            exit 1
          fi
          code="$(curl -sS -o /tmp/backup-body.json -w '%{http_code}' \
            -X POST "$CRON_URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")"
          echo "HTTP $code"
          cat /tmp/backup-body.json || true
          test "$code" = "200"
