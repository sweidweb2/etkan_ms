name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: SSH and pull + rebuild
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GIT_BRANCH
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/etkan_ms
            git fetch --prune "https://x-access-token:${GH_TOKEN}@github.com/sweidweb2/etkan_ms.git" "${GIT_BRANCH}"
            git checkout -B "${GIT_BRANCH}" FETCH_HEAD
            bash scripts/vps-deploy-prod.sh
