name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production VPS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Check VPS secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          [ -z "$VPS_HOST" ] && echo "::error::Add repository secret VPS_HOST (the VPS IP)." && missing=1
          [ -z "$VPS_USER" ] && echo "::error::Add repository secret VPS_USER (usually deploy)." && missing=1
          [ -z "$VPS_SSH_KEY" ] && echo "::error::Add repository secret VPS_SSH_KEY (private SSH key)." && missing=1
          exit "$missing"

      - name: SSH and pull + rebuild
        uses: appleboy/ssh-action@v1.2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_TOKEN,GIT_BRANCH
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/etkan_ms
            git fetch --prune "https://x-access-token:${GH_TOKEN}@github.com/sweidweb2/etkan_ms.git" "${GIT_BRANCH}"
            git checkout -f -B "${GIT_BRANCH}" FETCH_HEAD
            bash scripts/vps-deploy-prod.sh
